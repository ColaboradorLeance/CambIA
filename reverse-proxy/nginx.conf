server {
    # Porta alta (não-privilegiada): ver Dockerfile — container roda sem privilégio. O
    # mapeamento pra porta 80 do host continua igual (docker-compose.yml).
    listen 8080;
    server_name _;
    # Tudo em HTTP redireciona pra HTTPS — o ponto inteiro desta etapa é garantir que
    # ninguém fale com a aplicação em texto puro.
    return 301 https://$host$request_uri;
}

server {
    # Porta alta (não-privilegiada): ver Dockerfile. Mapeamento pra porta 443 do host
    # continua igual — não muda nada pra quem acessa de fora.
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Achado de revisão de segurança: nenhuma resposta desta aplicação levava cabeçalho de
    # segurança nenhum além do que o Spring Security já manda por padrão nas rotas da API
    # (X-Content-Type-Options, X-Frame-Options, X-XSS-Protection) — e mesmo essas, o
    # front-end (a SPA em si, os arquivos estáticos) não tinha nenhuma. Como o reverse-proxy
    # é o único ponto de entrada de tudo (Fase 3A), definir aqui garante a mesma política
    # pra front-end e API, sem depender de cada lado lembrar de configurar a sua. Aplicado
    # nos dois locations abaixo (cada um repete o bloco inteiro: uma vez que um location
    # define qualquer add_header, ele para de herdar os do nível acima — regra do próprio
    # nginx). Content-Security-Policy calibrado pro que a SPA de fato usa: build do Vite
    # sem script inline (só arquivos próprios), mas com estilo inline via prop `style={}`
    # do React (por isso `style-src` precisa de `unsafe-inline`) e fonte do Google Fonts.
    # HSTS (Strict-Transport-Security) foi decidido ficar de fora por enquanto: com
    # certificado autoassinado (Fase 3A), habilitá-lo arrisca travar o acesso de vez pra
    # quem já visitou uma vez, sem opção de "continuar mesmo assim" no navegador, caso o
    # certificado seja regenerado (reset do volume, troca de CERT_CN) antes do
    # navegador esquecer a política — o próprio propósito do HSTS (não deixar contornar erro
    # de certificado) vira uma armadilha de suporte com um certificado que não é de uma CA
    # confiável. Fica pra quando houver um certificado emitido por CA real.

    # API do backend — mesma origem do front-end a partir daqui (achado de revisão de
    # segurança resolvido de graça: CORS deixa de ser necessário em produção, e é
    # pré-requisito pra sessão em cookie SameSite=Strict, na próxima etapa).
    #
    # Achado de revisão de segurança ("olhar de hacker ético" — inconsistência inofensiva,
    # não é bypass de nada): a regex era case-sensitive (~) — uma variação de maiúscula
    # em qualquer parte do caminho (ex.: /Auth/verify, /Clientes) caía na regra genérica
    # "location /" abaixo (front-end) em vez desta aqui, devolvendo a SPA (404 da própria
    # SPA, na prática) em vez de chegar no backend. Trocado pra ~* (case-insensitive) — o
    # Spring MVC já trata rota com maiúscula como não-encontrada de qualquer forma, mas o
    # comportamento do proxy passa a ser previsível e consistente com o roteamento real,
    # em vez de depender de cair silenciosamente na outra regra.
    location ~* ^/(auth|clientes|bancos|calculos|usuarios|operacoes|relatorios|fechamentos|actuator)(/|$) {
        # O Spring Security já manda a própria versão desses três — descarta a dele e usa
        # a mesma política única definida aqui, pra não mandar o mesmo cabeçalho duas vezes
        # (a maioria dos navegadores lida mal com isso pra cabeçalho de segurança).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tudo o mais (a SPA) vai pro front-end.
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # Porta alta: ver frontend/Dockerfile e frontend/nginx.conf.
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
