services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cambia
      POSTGRES_USER: cambia
      # Achado de revisão de segurança: senha vinha fixa ("cambia") direto no compose.
      # Continua com esse valor por padrão (não quebra o ambiente de dev de quem já usa),
      # mas agora é configurável — defina POSTGRES_PASSWORD no .env com uma senha forte
      # antes de expor a porta 5432 além do localhost. Ver README.md.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cambia"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cambia
      SPRING_DATASOURCE_USERNAME: cambia
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cambia}
      # Envio real do link magico por e-mail (SMTP) - desligado por padrao.
      # Para habilitar de verdade (relay SMTP do Microsoft 365 / Exchange Online no Azure,
      # quando o plano estiver disponivel) ou para testar contra o Mailpit deste compose
      # (ver servico "mailpit" abaixo), defina essas variaveis num arquivo .env (nao
      # versionado) - veja .env.example para os dois casos.
      CAMBIA_MAIL_HABILITADO: ${CAMBIA_MAIL_HABILITADO:-false}
      CAMBIA_MAIL_REMETENTE: ${CAMBIA_MAIL_REMETENTE:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_SMTP_STARTTLS: ${SPRING_MAIL_SMTP_STARTTLS:-true}
    # Achado de revisão de segurança (Fase 3A): não publica mais a porta 8080 direto no
    # host — só o "reverse-proxy" (HTTPS) fica exposto de fora. Continua alcançável
    # normalmente por outros containers da mesma rede (ex: reverse-proxy) pelo nome
    # "backend", sem precisar de "ports" pra isso.
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Endereço em que o NAVEGADOR do usuário vai acessar o backend. Com o
        # reverse-proxy (Fase 3A), front-end e backend viram a MESMA origem — path
        # relativo (vazio) funciona e é o padrão agora. Só defina VITE_API_URL no .env
        # se estiver rodando SEM o reverse-proxy (ex: acessando o backend direto numa
        # porta própria) — ver README.md.
        VITE_API_URL: ${VITE_API_URL:-}
    # Achado de revisão de segurança (Fase 3A): idem ao backend — não publica mais
    # porta direto no host, só alcançável via reverse-proxy.
    depends_on:
      - backend

  # Reverse proxy HTTPS (Fase 3A da revisão de segurança) — único ponto de entrada
  # exposto no host. Termina TLS (certificado autoassinado gerado automaticamente na
  # primeira subida, guardado no volume "reverse_proxy_certs") e encaminha por prefixo
  # de caminho: /auth, /clientes, /bancos, etc. -> backend; o resto -> frontend. HTTP
  # (porta 80) só existe pra redirecionar pra HTTPS. Ver reverse-proxy/README ou
  # docs/decisoes.md pra detalhes e como trocar por um certificado de verdade.
  reverse-proxy:
    build: ./reverse-proxy
    environment:
      # Nome/IP do servidor no certificado — troque no .env em produção
      # (ex: CERT_CN=192.168.1.50 ou CERT_CN=cambia.suaempresa.local).
      CERT_CN: ${CERT_CN:-localhost}
    volumes:
      - reverse_proxy_certs:/etc/nginx/certs
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - backend
      - frontend

  # Servidor SMTP de teste: captura os e-mails enviados pelo backend sem entregar a
  # ninguem de verdade. Interface web em http://localhost:8025. Util pra testar o envio
  # real do link magico (CAMBIA_MAIL_HABILITADO=true) antes de ter as credenciais do
  # relay SMTP definitivo (Microsoft 365 / Exchange Online no Azure) - ver .env.example.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
  reverse_proxy_certs:
