# nginx.conf da imagem única — fusão do antigo reverse-proxy/nginx.conf (TLS,
# cabeçalhos de segurança, roteamento por prefixo) com o antigo frontend/nginx.conf
# (serve os arquivos estáticos da SPA direto, sem mais precisar de um proxy_pass extra
# pra um container "frontend" separado — front-end e reverse-proxy são o mesmo
# container agora).

server {
    # Porta alta (não-privilegiada): ver Dockerfile — container roda sem privilégio. O
    # mapeamento pra porta 80 do host continua igual (docker-compose.yml).
    listen 8080;
    server_name _;
    # Tudo em HTTP redireciona pra HTTPS — o ponto inteiro desta etapa é garantir que
    # ninguém fale com a aplicação em texto puro.
    return 301 https://$host$request_uri;
}

server {
    # Porta alta (não-privilegiada): ver Dockerfile. Mapeamento pra porta 443 do host
    # continua igual — não muda nada pra quem acessa de fora.
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Achado de revisão de segurança (herdado do reverse-proxy original): nenhuma
    # resposta desta aplicação levava cabeçalho de segurança nenhum além do que o
    # Spring Security já manda por padrão nas rotas da API — e mesmo essas, o front-end
    # (a SPA em si) não tinha nenhuma. Como este nginx é o único ponto de entrada de
    # tudo, definir aqui garante a mesma política pra front-end e API. Aplicado nos dois
    # locations abaixo (um location que define qualquer add_header para de herdar os do
    # nível acima — regra do próprio nginx, por isso o bloco se repete).
    # Content-Security-Policy calibrado pro que a SPA de fato usa: build do Vite sem
    # script inline, mas com estilo inline via prop `style={}` do React (por isso
    # `style-src` precisa de `unsafe-inline`) e fonte do Google Fonts. HSTS
    # (Strict-Transport-Security) fica de fora por enquanto: com certificado
    # autoassinado, habilitá-lo arrisca travar o acesso de vez pra quem já visitou uma
    # vez, sem opção de "continuar mesmo assim", caso o certificado seja regenerado
    # antes do navegador esquecer a política.

    # API do backend — mesma origem do front-end a partir daqui (CORS deixa de ser
    # necessário em produção, e é pré-requisito pra sessão em cookie SameSite=Strict).
    # Regex case-insensitive (~*) — o Spring MVC já trata rota com maiúscula como
    # não-encontrada de qualquer forma, mas o comportamento do proxy fica previsível.
    location ~* ^/(auth|clientes|bancos|calculos|usuarios|operacoes|relatorios|fechamentos|actuator)(/|$) {
        # O Spring Security já manda a própria versão desses três — descarta a dele e
        # usa a mesma política única definida aqui, pra não mandar o mesmo cabeçalho
        # duas vezes (a maioria dos navegadores lida mal com isso).
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # Backend Java no mesmo container, só em loopback — nunca exposto fora dele.
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tudo o mais é a SPA — servida direto (arquivos estáticos deste mesmo container),
    # sem mais precisar de um proxy_pass pra um segundo nginx num container "frontend".
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        try_files $uri $uri/ /index.html;
    }
}
