server {
    # Porta alta (não-privilegiada): ver Dockerfile — container roda sem privilégio.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Os arquivos em /assets têm hash do conteúdo no nome (index-DvGnBFyn.js): podem
    # ser cacheados pra sempre — qualquer versão nova gera um nome novo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Já o index.html NUNCA pode ficar preso em cache: é ele que aponta pro bundle
    # com hash. Sem este header o navegador usava cache heurístico (baseado em
    # Last-Modified) e continuava mostrando a versão antiga do sistema após um
    # deploy, até um Ctrl+F5 manual — foi exatamente o que aconteceu ao vivo.
    # "no-cache" não proíbe guardar, só força revalidar (ETag) a cada carga.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
