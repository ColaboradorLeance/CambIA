spring.application.name=CambIA

# Achado de revisão de segurança: "always" expunha detalhes internos (host do servidor de
# e-mail, espaço em disco, etc.) em /actuator/health sem exigir login nenhum — o endpoint
# precisa continuar público (é usado pelo healthcheck do Docker), mas os detalhes não
# deveriam. Tentativa com "when-authorized" (+ management.endpoint.health.roles) não
# funcionou de forma confiável com o filtro de autenticação próprio desta aplicação (o
# SecurityContext não era enxergado pelo mecanismo de autorização do Actuator, mesmo com
# um token válido) — "never" é mais simples e garante que ninguém vê detalhe nenhum por
# aqui, só o status básico (UP/DOWN), que é tudo que o healthcheck precisa.
management.endpoint.health.show-details=never

# Corpo de erro (400/404/409/...) inclui mensagem e detalhes de validação de campo,
# para o front-end conseguir mostrar um pop-up dizendo o que de fato aconteceu
# (em vez de só "Bad Request"). Sem dado sensível: só mensagens de validação de negócio.
server.error.include-message=always
server.error.include-binding-errors=always
spring.mvc.problemdetails.enabled=true

spring.jpa.hibernate.ddl-auto=validate

# Bug de configuração encontrado ao vivo: origem adicional liberada no CORS, além do dev
# local (Vite, http://localhost:5173) — precisa ser a origem real por onde o navegador
# acessa o reverse-proxy em produção (Fase 3A), senão o próprio CorsFilter do Spring
# rejeita a requisição com 403 antes de chegar em qualquer controller. Ver docker-compose.yml
# (deriva do mesmo CERT_CN usado pro certificado) e SecurityConfig.
cambia.cors.origem-adicional=${CAMBIA_CORS_ORIGEM_ADICIONAL:https://localhost}

# Envio de e-mail do link magico de login. Desligado por padrao (usa LoggingMagicLinkSender).
# Para habilitar em producao: CAMBIA_MAIL_HABILITADO=true, CAMBIA_MAIL_REMETENTE=<endereco>,
# mais as variaveis padrao do Spring: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD (relay SMTP do Microsoft 365 / Exchange Online: smtp.office365.com, porta 587).
cambia.mail.habilitado=${CAMBIA_MAIL_HABILITADO:false}
cambia.mail.remetente=${CAMBIA_MAIL_REMETENTE:}
# Auth e STARTTLS ligados por padrao (necessario pro relay do Microsoft 365 / Exchange
# Online). Desligue os dois (SPRING_MAIL_SMTP_AUTH=false, SPRING_MAIL_SMTP_STARTTLS=false)
# para testar contra um servidor SMTP de teste sem autenticacao, como o Mailpit.
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}

# Achado ao vivo (testando a imagem única com Docker Compose): o indicador de saúde de
# e-mail do Spring Boot tenta autenticar de verdade no servidor SMTP configurado — e
# derruba o /actuator/health inteiro sempre que SPRING_MAIL_HOST está definido (mesmo
# como string vazia, que é o que o docker-compose.yml sempre injeta, configurado ou
# não) mas incompleto/inacessível, mesmo com CAMBIA_MAIL_HABILITADO=false. Em teste
# automatizado isso não aparece porque a variável simplesmente não existe no ambiente
# (diferente de existir vazia). Envio de e-mail é opcional — login continua funcionando
# via link no log quando desligado — então não faz sentido ele derrubar a saúde geral
# do sistema.
management.health.mail.enabled=false

