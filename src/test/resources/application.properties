# Limite de tentativas de autenticação (ver LimitadorDeRequisicoes) fica bem alto nos
# testes: o MockMvc simula todas as requisições vindo do mesmo IP, e TestAuthSupport
# passa por /auth/verify de verdade dezenas de vezes na suíte inteira — com o valor
# padrão de produção, isso estouraria o limite e quebraria testes sem relação nenhuma
# com autenticação. O comportamento do limitador em si é testado à parte, com valores
# baixos, em LimitadorDeRequisicoesTests (unitário) e AuthRateLimitControllerTests
# (com @TestPropertySource só naquela classe).
cambia.rate-limit.auth.maximo=100000

# Mesmo motivo, pro limitador de tentativas com chave de API inválida (Incremento 80 — é
# separado do limitador do login). O comportamento dele é testado com valores baixos em
# ChaveApiRateLimitTests e ChaveApiLimitadorIsoladoTests.
cambia.rate-limit.chave-api.maximo=100000
